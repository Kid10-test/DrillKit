# CI DrillKit — typecheck + build + regresi penuh (107 rangkaian).
#
# Setiap **commit** menjalankan seluruh rangkaian uji ke versinya yang sudah
# di-build (`vite preview`), sama persis dengan yang dijalankan lokal via
# `bash qa/regresi-penuh.sh`. Tidak ada server, tidak ada rahasia: yang
# dibutuhkan hanya Node, Chrome (diambil puppeteer), dan pustaka sistem
# Chrome dari apt.
name: CI

# Satu commit = satu run.
#
# Dulu `push:` tanpa saringan digabung `pull_request:`, sehingga setiap commit
# di branch yang sudah punya PR menyalakan DUA run ±60 menit — satu untuk
# event push, satu untuk pull_request. Terukur 1–7 Okt 2026: **39 run untuk 24
# commit, 1.990 menit**, padahal repo private paket Free hanya diberi 2.000
# menit per bulan; job sesudahnya ditolak sebelum mulai ("job was not started
# … spending limit"). Kini `push` hanya untuk `main`, dan commit di branch
# diuji lewat PR-nya.
#
# Konsekuensinya: commit di branch yang BELUM punya PR tidak diuji sampai
# PR-nya dibuka. Di proyek ini PR selalu dibuka segera setelah push, jadi
# jendelanya sempit — dan jauh lebih murah daripada membakar 60 menit dua kali.
on:
  push:
    branches: [main]
  pull_request:

# Commit baru di ref yang sama membatalkan run yang masih berjalan.
#
# Regresi penuh makan ±60 menit, jadi dua push yang berdekatan membuat run
# pertama sia-sia: pada 6 Okt ada empat run yang mulai dalam satu menit
# (±240 menit) padahal hanya commit terakhir yang perlu diuji. Dihitung ulang
# dari data yang sama, pemakaian Oktober itu cukup ±1.049 menit — hemat 47%
# tanpa mengurangi satu pun rangkaian yang dijalankan.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  uji:
    # Ubuntu 24.04 (noble): nama paketnya sudah generasi `t64`, dan daftar
    # apt di bawah ditulis untuknya. Jangan ganti versi tanpa menyesuaikan.
    runs-on: ubuntu-24.04
    # Regresi penuh ±40 menit (ada jeda 10 detik antar-rangkaian, lihat
    # qa/regresi.sh) + instalasi. Batas 90 menit memberi ruang lega tanpa
    # menggantung selamanya bila ada yang macet.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            qa/package-lock.json

      - name: Dependensi aplikasi
        run: npm ci

      - name: Dependensi uji (puppeteer + Chrome)
        run: npm --prefix qa ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Pustaka sistem Chrome
        run: |
          sudo apt-get update
          # Daftar per paket dengan `|| true`: nama paket berbeda antar
          # generasi Ubuntu (*-t64 di noble), dan satu nama yang tidak ada
          # tidak boleh menggugurkan seluruh instalasi.
          for p in libnspr4 libnss3 libatk1.0-0 libatk-bridge2.0-0 libcups2 \
            libdrm2 libxkbcommon0 libxcomposite1 libxdamage1 libxfixes3 \
            libxrandr2 libgbm1 libpango-1.0-0 libcairo2 libasound2 \
            libatk1.0-0t64 libatk-bridge2.0-0t64 libcups2t64 libasound2t64; do
            sudo apt-get install -y "$p" >/dev/null 2>&1 || echo "  (lewati $p)"
          done

      - name: Chrome bisa jalan (gagal cepat bila pustaka kurang)
        run: |
          cd qa
          node -e "import('puppeteer').then(async ({default: p}) => {
            const b = await p.launch({ args: ['--no-sandbox'] })
            console.log(await b.version())
            await b.close()
          })"

      - name: Pratinjau build
        run: |
          (npm run preview -- --port 4173 --strictPort >/tmp/preview.log 2>&1 &)
          for i in $(seq 1 60); do
            curl -sf http://localhost:4173/ >/dev/null && break
            sleep 2
          done
          curl -sf http://localhost:4173/ >/dev/null

      - name: Regresi penuh
        run: bash qa/regresi-penuh.sh http://localhost:4173
