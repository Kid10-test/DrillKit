# CI DrillKit — typecheck + build + regresi penuh (167 rangkaian).
#
# Setiap **PR** menjalankan seluruh rangkaian uji ke versinya yang sudah
# di-build (`vite preview`), sama persis dengan yang dijalankan lokal via
# `bash qa/regresi-penuh.sh`. Tidak ada server, tidak ada rahasia: yang
# dibutuhkan hanya Node, Chrome (diambil puppeteer), dan pustaka sistem
# Chrome dari apt.
name: CI

# Satu PR = satu regresi penuh.
#
# Riwayat pemborosan menit:
#   • 1–7 Okt 2026: `push:` tanpa saringan + `pull_request:` membuat setiap
#     commit di branch ber-PR menyalakan DUA run. 39 run untuk 24 commit,
#     1.990 menit, padahal repo private paket Free hanya diberi 2.000 menit
#     per bulan. Sejak itu `push` hanya untuk `main`.
#   • Nov 2026: masih ada dobel. Setiap PR diuji penuh (±82 menit), lalu
#     setelah di-merge `main` diuji penuh LAGI (±82 menit). Padahal run
#     `pull_request` sudah menguji commit gabungan PR dengan `main`
#     (refs/pull/N/merge), yaitu isi yang sama yang mendarat di `main`.
#     Satu PR jadi makan ±165 menit; dalam repo private itu hanya cukup
#     untuk ±12 PR per bulan.
#
# Sekarang:
#   • `pull_request` → job `bangun` + job `uji` (regresi penuh).
#   • `push` ke `main` → job `bangun` saja (typecheck + build, ±1 menit),
#     supaya `main` tetap dicek bisa di-build dan lencana CI tetap bermakna.
#   • `workflow_dispatch` → regresi penuh manual, misalnya sebelum rilis,
#     atau bila dua PR di-merge berurutan tanpa saling menunggu.
#
# Konsekuensinya: commit di branch yang BELUM punya PR tidak diuji sampai
# PR-nya dibuka. Di proyek ini PR selalu dibuka segera setelah push.
on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
  pull_request:
    paths-ignore:
      - '**.md'
  workflow_dispatch:

# Commit baru di ref yang sama membatalkan run yang masih berjalan.
#
# Regresi penuh makan ±60 menit, jadi dua push yang berdekatan membuat run
# pertama sia-sia: pada 6 Okt ada empat run yang mulai dalam satu menit
# (±240 menit) padahal hanya commit terakhir yang perlu diuji. Dihitung ulang
# dari data yang sama, pemakaian Oktober itu cukup ±1.049 menit — hemat 47%
# tanpa mengurangi satu pun rangkaian yang dijalankan.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bangun:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Dependensi aplikasi
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

  uji:
    # Regresi penuh hanya untuk PR dan pemicu manual (lihat catatan `on:`).
    if: github.event_name != 'push'
    # Ubuntu 24.04 (noble): nama paketnya sudah generasi `t64`, dan daftar
    # apt di bawah ditulis untuknya. Jangan ganti versi tanpa menyesuaikan.
    runs-on: ubuntu-24.04
    # Regresi penuh sempat ±82 menit dengan jeda 10 detik antar-rangkaian,
    # nyaris menyentuh batas 90 menit. Dengan `JEDA=4` dan tanpa jeda sesudah
    # rangkaian `*-logika` (lihat qa/regresi.sh), perkiraannya ±60 menit.
    # Batas 90 menit tetap, supaya run yang macet tidak menggantung.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            qa/package-lock.json

      - name: Dependensi aplikasi
        run: npm ci

      - name: Dependensi uji (puppeteer + Chrome)
        run: npm --prefix qa ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Pustaka sistem Chrome
        run: |
          sudo apt-get update
          # Daftar per paket dengan `|| true`: nama paket berbeda antar
          # generasi Ubuntu (*-t64 di noble), dan satu nama yang tidak ada
          # tidak boleh menggugurkan seluruh instalasi.
          for p in libnspr4 libnss3 libatk1.0-0 libatk-bridge2.0-0 libcups2 \
            libdrm2 libxkbcommon0 libxcomposite1 libxdamage1 libxfixes3 \
            libxrandr2 libgbm1 libpango-1.0-0 libcairo2 libasound2 \
            libatk1.0-0t64 libatk-bridge2.0-0t64 libcups2t64 libasound2t64; do
            sudo apt-get install -y "$p" >/dev/null 2>&1 || echo "  (lewati $p)"
          done

      - name: Chrome bisa jalan (gagal cepat bila pustaka kurang)
        run: |
          cd qa
          node -e "import('puppeteer').then(async ({default: p}) => {
            const b = await p.launch({ args: ['--no-sandbox'] })
            console.log(await b.version())
            await b.close()
          })"

      - name: Pratinjau build
        run: |
          (npm run preview -- --port 4173 --strictPort >/tmp/preview.log 2>&1 &)
          for i in $(seq 1 60); do
            curl -sf http://localhost:4173/ >/dev/null && break
            sleep 2
          done
          curl -sf http://localhost:4173/ >/dev/null

      - name: Regresi penuh
        env:
          # Runner GitHub bermemori 7–16 GB, jadi jeda 4 detik sudah cukup
          # bagi Chrome melepas memorinya. Naikkan bila muncul gagal acak.
          JEDA: '4'
        run: bash qa/regresi-penuh.sh http://localhost:4173
